<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      /* Scene 01: First dot appears */
      @keyframes dotAppear {
        0% { transform: scale(0); opacity: 0; }
        60% { transform: scale(1.1); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }

      /* Scene 01→02: Initial dot fades */
      @keyframes dotFadeOut {
        0% { opacity: 1; }
        100% { opacity: 0; }
      }

      /* Scene 02: Dots split to final positions */
      @keyframes dotSplit1 {
        0% { transform: translate(0px, 0px) scale(0.4); opacity: 0; }
        30% { opacity: 1; }
        100% { transform: translate(-36px, -14px) scale(1); opacity: 1; }
      }
      @keyframes dotSplit2 {
        0% { transform: translate(0px, 0px) scale(0.4); opacity: 0; }
        30% { opacity: 1; }
        100% { transform: translate(34px, 10px) scale(1); opacity: 1; }
      }
      @keyframes dotSplit3 {
        0% { transform: translate(0px, 0px) scale(0.4); opacity: 0; }
        30% { opacity: 1; }
        100% { transform: translate(-11px, 40px) scale(1); opacity: 1; }
      }

      /* Scene 03-04: Stroke reveal for arcs */
      @keyframes strokeReveal {
        0% { stroke-dashoffset: 300; }
        100% { stroke-dashoffset: 0; }
      }

      /* Scene 06: Micro-settle */
      @keyframes microSettle {
        0% { transform: translate(0px, 0px); }
        40% { transform: translate(0.3px, -0.3px); }
        70% { transform: translate(-0.15px, 0.15px); }
        100% { transform: translate(0px, 0px); }
      }

      .logo-group {
        animation: microSettle 0.4s cubic-bezier(0.25, 0.1, 0.25, 1) 5.2s forwards;
      }

      /* Scene 01 */
      .dot-initial {
        transform-origin: 256px 270px;
        animation:
          dotAppear 0.7s cubic-bezier(0, 0, 0.2, 1) forwards,
          dotFadeOut 0.12s ease 1.18s forwards;
        opacity: 0;
      }

      /* Scene 02 */
      .dot-final {
        opacity: 0;
        transform-origin: 256px 270px;
      }
      .dot-final-1 {
        animation: dotSplit1 0.75s cubic-bezier(0.4, 0, 0.2, 1) 1.3s forwards;
      }
      .dot-final-2 {
        animation: dotSplit2 0.75s cubic-bezier(0.4, 0, 0.2, 1) 1.45s forwards;
      }
      .dot-final-3 {
        animation: dotSplit3 0.75s cubic-bezier(0.4, 0, 0.2, 1) 1.6s forwards;
      }

      /* Scene 03-04: Arc reveals */
      .arc {
        stroke-dasharray: 300;
        stroke-dashoffset: 300;
        fill: none;
        stroke-linecap: round;
      }
      .arc-inner-top {
        stroke: #FF6600;
        stroke-width: 16;
        animation: strokeReveal 0.85s cubic-bezier(0.4, 0, 0.2, 1) 2.9s forwards;
      }
      .arc-outer-top {
        stroke: #FF6600;
        stroke-width: 18;
        animation: strokeReveal 0.85s cubic-bezier(0.4, 0, 0.2, 1) 3.35s forwards;
      }
      .arc-inner-bottom {
        stroke: #FF6600;
        stroke-width: 16;
        animation: strokeReveal 0.85s cubic-bezier(0.4, 0, 0.2, 1) 3.75s forwards;
      }
      .arc-outer-bottom {
        stroke: #FF6600;
        stroke-width: 18;
        animation: strokeReveal 0.85s cubic-bezier(0.4, 0, 0.2, 1) 4.15s forwards;
      }
    </style>
  </defs>

  <g class="logo-group">
    <!-- Scene 01: Initial single dot -->
    <circle class="dot-initial" cx="256" cy="270" r="28" fill="#FF6600"/>

    <!-- Scene 02: Three dots split outward -->
    <circle class="dot-final dot-final-1" cx="220" cy="256" r="32" fill="#FF6600"/>
    <circle class="dot-final dot-final-2" cx="290" cy="272" r="24" fill="#FF6600"/>
    <circle class="dot-final dot-final-3" cx="245" cy="310" r="18" fill="#FF6600"/>

    <!-- Scene 03-04: Signal arcs revealed via stroke -->
    <path class="arc arc-inner-top" d="M 185 210 Q 256 148 327 210"/>
    <path class="arc arc-outer-top" d="M 160 185 Q 256 105 352 185"/>
    <path class="arc arc-inner-bottom" d="M 185 302 Q 256 364 327 302"/>
    <path class="arc arc-outer-bottom" d="M 160 327 Q 256 407 352 327"/>
  </g>
</svg>