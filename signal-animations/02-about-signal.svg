<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <style>
      @keyframes ringPulse { 0% { opacity: 0.6; transform: scale(1); } 100% { opacity: 0; transform: scale(1.4); } }
      @keyframes nodeGlow { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
      @keyframes pulseDot { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.3); } }
      
      .ring { fill: none; animation: ringPulse 2.5s ease-out infinite; transform-origin: center; transform-box: fill-box; }
      .ring--1 { stroke: #FF6600; stroke-width: 1.5; animation-delay: 0s; }
      .ring--2 { stroke: #1A1AFF; stroke-width: 1; animation-delay: 0.5s; }
      .ring--3 { stroke: #FF6600; stroke-width: 0.8; animation-delay: 1s; }
      .ring--4 { stroke: #1A1AFF; stroke-width: 0.5; animation-delay: 1.5s; }
      .ring--5 { stroke: #FF6600; stroke-width: 0.3; animation-delay: 2s; }
      
      .node { animation: nodeGlow 2s ease-in-out infinite; }
      .node--c { animation-delay: 0s; }
      .node--1 { animation: nodeGlow 2.2s ease-in-out 0.3s infinite; }
      .node--2 { animation: nodeGlow 2.4s ease-in-out 0.6s infinite; }
      .node--3 { animation: nodeGlow 2.6s ease-in-out 0.9s infinite; }
      .node--4 { animation: nodeGlow 2.8s ease-in-out 1.2s infinite; }
      .node--5 { animation: nodeGlow 3s ease-in-out 0.2s infinite; }
      .node--6 { animation: nodeGlow 2.5s ease-in-out 0.7s infinite; }
      .node--7 { animation: nodeGlow 2.3s ease-in-out 1.1s infinite; }
      
      .pulse { animation: pulseDot 1.8s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .pulse--1 { animation-delay: 0s; }
      .pulse--2 { animation: pulseDot 2.1s ease-in-out 0.4s infinite; }
      .pulse--3 { animation: pulseDot 1.6s ease-in-out 0.8s infinite; }
      .pulse--4 { animation: pulseDot 2.4s ease-in-out 1.2s infinite; }
      
      .line { stroke-width: 0.8; opacity: 0.4; }
    </style>
  </defs>
  
  <!-- Grid lines -->
  <g opacity="0.12">
    <line x1="0" y1="80" x2="400" y2="80" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="400" y2="160" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="400" y2="240" stroke="#fff" stroke-width="0.5"/>
    <line x1="80" y1="0" x2="80" y2="320" stroke="#fff" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="320" stroke="#fff" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="320" stroke="#fff" stroke-width="0.5"/>
  </g>
  
  <!-- Signal rings -->
  <circle class="ring ring--1" cx="200" cy="160" r="20"/>
  <circle class="ring ring--2" cx="200" cy="160" r="45"/>
  <circle class="ring ring--3" cx="200" cy="160" r="75"/>
  <circle class="ring ring--4" cx="200" cy="160" r="110"/>
  <circle class="ring ring--5" cx="200" cy="160" r="150"/>
  
  <!-- Nodes -->
  <circle class="node node--c" cx="200" cy="160" r="5" fill="#FF6600"/>
  <circle class="node node--1" cx="120" cy="90" r="3" fill="#1A1AFF"/>
  <circle class="node node--2" cx="300" cy="100" r="3" fill="#FF6600"/>
  <circle class="node node--3" cx="80" cy="220" r="2.5" fill="#1A1AFF"/>
  <circle class="node node--4" cx="320" cy="230" r="2.5" fill="#FF6600"/>
  <circle class="node node--5" cx="200" cy="50" r="2" fill="#fff"/>
  <circle class="node node--6" cx="350" cy="160" r="2" fill="#fff"/>
  <circle class="node node--7" cx="50" cy="160" r="2" fill="#1A1AFF"/>
  
  <!-- Connection lines -->
  <line class="line" x1="200" y1="160" x2="120" y2="90" stroke="#1A1AFF"/>
  <line class="line" x1="200" y1="160" x2="300" y2="100" stroke="#FF6600"/>
  <line class="line" x1="200" y1="160" x2="80" y2="220" stroke="#1A1AFF" opacity="0.3"/>
  <line class="line" x1="200" y1="160" x2="320" y2="230" stroke="#FF6600" opacity="0.3"/>
  <line class="line" x1="200" y1="160" x2="200" y2="50" stroke="#fff" opacity="0.2"/>
  <line class="line" x1="200" y1="160" x2="350" y2="160" stroke="#fff" opacity="0.2"/>
  <line class="line" x1="120" y1="90" x2="200" y2="50" stroke="#1A1AFF" opacity="0.2"/>
  <line class="line" x1="300" y1="100" x2="350" y2="160" stroke="#FF6600" opacity="0.2"/>
  
  <!-- Pulse dots -->
  <circle class="pulse pulse--1" cx="160" cy="125" r="1.5" fill="#FF6600"/>
  <circle class="pulse pulse--2" cx="250" cy="130" r="1.5" fill="#1A1AFF"/>
  <circle class="pulse pulse--3" cx="140" cy="200" r="1" fill="#fff"/>
  <circle class="pulse pulse--4" cx="270" cy="195" r="1" fill="#FF6600"/>
</svg>