<svg opacity="0.55" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <style>
      @keyframes expand {
        0% { transform: scale(0.15); opacity: 0.65; }
        100% { transform: scale(8.2); opacity: 0; }
      }
      .ring { fill: none; animation: expand 4s ease-out infinite; transform-origin: center; transform-box: fill-box; }
      .ring--1 { stroke: #7A70FF; animation-delay: 0s; }
      .ring--2 { stroke: #2457FF; animation-delay: 0.8s; }
      .ring--3 { stroke: #2457FF; animation-delay: 1.6s; }
      .ring--4 { stroke: #7A70FF; animation-delay: 2.4s; opacity: 0.3; }
      .ring--5 { stroke: #2457FF; animation-delay: 3.2s; }
      .dot { fill: #7A70FF; }
    </style>
  </defs>
  <circle class="dot" cx="200" cy="200" r="6"/>
  <circle class="ring ring--1" cx="200" cy="200" r="24"/>
  <circle class="ring ring--2" cx="200" cy="200" r="24"/>
  <circle class="ring ring--3" cx="200" cy="200" r="24"/>
  <circle class="ring ring--4" cx="200" cy="200" r="24"/>
  <circle class="ring ring--5" cx="200" cy="200" r="24"/>
</svg>