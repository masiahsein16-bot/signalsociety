<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cococia — Device Mockups</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      color: white;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
      background: linear-gradient(135deg, #4ade80, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      color: #94a3b8;
      font-size: 1.1rem;
      margin-bottom: 60px;
      text-align: center;
    }

    .devices-row {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
    }

    .device-label {
      text-align: center;
      margin-top: 24px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #64748b;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ── LAPTOP ── */
    .laptop {
      position: relative;
    }
    .laptop-screen {
      width: 720px;
      height: 460px;
      border: 3px solid #334155;
      border-radius: 12px 12px 0 0;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 60px rgba(0,0,0,.5), 0 0 120px rgba(34,211,238,.06);
    }
    .laptop-screen iframe {
      width: 1920px;
      height: 1080px;
      border: none;
      transform: scale(0.375);
      transform-origin: top left;
    }
    .laptop-base {
      width: 800px;
      height: 18px;
      background: linear-gradient(180deg, #475569, #334155);
      border-radius: 0 0 12px 12px;
      margin: 0 auto;
      position: relative;
    }
    .laptop-base::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 5px;
      background: #1e293b;
      border-radius: 0 0 6px 6px;
    }
    .laptop-notch {
      width: 8px;
      height: 8px;
      background: #1e293b;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* ── TABLET ── */
    .tablet {
      position: relative;
    }
    .tablet-frame {
      width: 340px;
      height: 480px;
      border: 6px solid #1e293b;
      border-radius: 24px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 60px rgba(0,0,0,.5), 0 0 80px rgba(74,222,128,.06);
    }
    .tablet-frame iframe {
      width: 1024px;
      height: 1366px;
      border: none;
      transform: scale(0.332);
      transform-origin: top left;
    }
    .tablet-home {
      width: 30px;
      height: 4px;
      background: #475569;
      border-radius: 4px;
      margin: 8px auto 0;
    }

    /* ── PHONE ── */
    .phone {
      position: relative;
    }
    .phone-frame {
      width: 220px;
      height: 440px;
      border: 5px solid #1e293b;
      border-radius: 32px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 60px rgba(0,0,0,.5), 0 0 80px rgba(34,211,238,.06);
      position: relative;
    }
    .phone-frame iframe {
      width: 390px;
      height: 844px;
      border: none;
      transform: scale(0.558);
      transform-origin: top left;
    }
    .phone-notch {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 24px;
      background: #1e293b;
      border-radius: 14px;
      z-index: 10;
    }
    .phone-notch::after {
      content: '';
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 8px;
      background: #334155;
      border-radius: 50%;
    }

    /* ── SECTION LABELS ── */
    .section-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-top: 80px;
      margin-bottom: 40px;
      color: #e2e8f0;
      text-align: center;
    }
    .section-title span {
      color: #4ade80;
    }

    /* ── Screenshots Grid ── */
    .screenshots-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      max-width: 1200px;
      width: 100%;
      margin-bottom: 60px;
    }
    .screenshot-card {
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #334155;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .screenshot-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(0,0,0,.3);
    }
    .screenshot-card .card-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .screenshot-card .card-body {
      padding: 16px;
    }
    .screenshot-card h3 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 4px;
    }
    .screenshot-card p {
      font-size: 0.8rem;
      color: #64748b;
    }

    @media (max-width: 1200px) {
      .laptop-screen { width: 540px; height: 345px; }
      .laptop-screen iframe { transform: scale(0.281); }
      .laptop-base { width: 600px; }
    }
    @media (max-width: 900px) {
      .devices-row { gap: 30px; }
      .laptop-screen { width: 420px; height: 268px; }
      .laptop-screen iframe { transform: scale(0.219); }
      .laptop-base { width: 470px; }
    }
    @media (max-width: 600px) {
      h1 { font-size: 1.6rem; }
      .devices-row { flex-direction: column; align-items: center; }
      .laptop-screen { width: 320px; height: 200px; }
      .laptop-screen iframe { transform: scale(0.167); }
      .laptop-base { width: 360px; }
      .screenshots-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <h1>Cococia — Responsive Mockups</h1>
  <p class="subtitle">Website preview across all device sizes</p>

  <!-- ═══════════════════ LAPTOP ═══════════════════ -->
  <p class="section-title">Laptop <span>1440px</span></p>
  <div class="devices-row">
    <div class="laptop">
      <div class="laptop-screen">
        <iframe src="index.html" title="Laptop mockup"></iframe>
      </div>
      <div class="laptop-base">
        <div class="laptop-notch"></div>
      </div>
    </div>
  </div>
  <p class="device-label">MacBook / Desktop Browser</p>

  <!-- ═══════════════════ TABLET ═══════════════════ -->
  <p class="section-title">Tablet <span>768px</span></p>
  <div class="devices-row">
    <div class="tablet">
      <div class="tablet-frame">
        <iframe src="index.html" title="Tablet mockup"></iframe>
      </div>
      <div class="tablet-home"></div>
    </div>
  </div>
  <p class="device-label">iPad / Tablet Browser</p>

  <!-- ═══════════════════ PHONE ═══════════════════ -->
  <p class="section-title">Phone <span>390px</span></p>
  <div class="devices-row">
    <div class="phone">
      <div class="phone-frame">
        <div class="phone-notch"></div>
        <iframe src="index.html" title="Phone mockup"></iframe>
      </div>
    </div>
  </div>
  <p class="device-label">iPhone / Mobile Browser</p>

  <!-- ═══════════════════ ALL TOGETHER ═══════════════════ -->
  <p class="section-title" style="margin-top:100px">All Devices <span>Together</span></p>
  <div class="devices-row" style="gap: 30px;">
    <!-- Phone -->
    <div class="phone">
      <div class="phone-frame">
        <div class="phone-notch"></div>
        <iframe src="index.html" title="Phone mockup group"></iframe>
      </div>
    </div>
    <!-- Laptop -->
    <div class="laptop">
      <div class="laptop-screen">
        <iframe src="index.html" title="Laptop mockup group"></iframe>
      </div>
      <div class="laptop-base">
        <div class="laptop-notch"></div>
      </div>
    </div>
    <!-- Tablet -->
    <div class="tablet">
      <div class="tablet-frame">
        <iframe src="index.html" title="Tablet mockup group"></iframe>
      </div>
      <div class="tablet-home"></div>
    </div>
  </div>

</body>
</html>
